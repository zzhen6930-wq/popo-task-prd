<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>WorkHub Studio 后台 · MCP · 高保真原型</title>
<style>
  :root{
    --indigo:#6366f1; --indigo-d:#4f46e5; --violet:#7c3aed;
    --ink:#0f172a; --txt:#334155; --sub:#64748b; --mut:#94a3b8;
    --line:#e5e7eb; --line-2:#f1f5f9; --bg:#f8fafc; --bg-2:#eef2f7;
    --ok:#16a34a; --warn:#b45309; --danger:#ef4444;
    --shadow-sm:0 1px 2px rgba(15,23,42,.06);
    --shadow-md:0 4px 16px rgba(15,23,42,.08);
    --shadow-lg:0 20px 60px rgba(15,23,42,.22);
    --r:10px;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{ font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg-2); color:var(--txt); padding:24px 16px 60px; line-height:1.6; -webkit-font-smoothing:antialiased; }

  .page-label{ max-width:1400px; margin:6px auto 12px; display:flex; align-items:center; gap:10px; }
  .page-label .b-num{ background:var(--indigo); color:#fff; width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:800; }
  .page-label .b-title{ font-size:17px; font-weight:800; color:var(--ink); }
  .page-label .b-desc{ font-size:12.5px; color:var(--sub); }

  .app{ max-width:1400px; margin:0 auto; background:#fff; border-radius:16px; overflow:hidden; box-shadow:var(--shadow-md); border:1px solid var(--line); height:900px; display:flex; position:relative; }

  /* topbar */
  .topbar{ position:absolute; top:0; left:0; right:0; height:58px; background:#fff; border-bottom:1px solid var(--line-2); display:flex; align-items:center; padding:0 22px; z-index:3; }
  .logo{ display:flex; align-items:center; gap:9px; font-size:17px; font-weight:800; color:var(--ink); }
  .logo-icon{ width:24px; height:24px; background:linear-gradient(135deg,var(--indigo-d),var(--violet)); border-radius:7px; display:flex; align-items:center; justify-content:center; color:#fff; font-size:12px; font-weight:800; }
  .env-tag{ margin-left:12px; background:#f5f3ff; border:1px solid #ddd6fe; border-radius:6px; padding:4px 10px; font-size:12px; color:#6d28d9; font-weight:700; }
  .topbar .right{ margin-left:auto; display:flex; align-items:center; gap:14px; }
  .tenant-switch{ display:inline-flex; align-items:center; gap:7px; font-size:13px; color:var(--txt); background:#fff; border:1px solid var(--line); border-radius:8px; padding:6px 11px; cursor:pointer; font-weight:600; }
  .tenant-switch:hover{ border-color:#c7d2fe; }
  .nav-link{ font-size:13px; color:var(--txt); font-weight:600; cursor:pointer; }
  .nav-link:hover{ color:var(--indigo-d); }
  .txt-act{ font-size:13px; font-weight:600; cursor:pointer; }
  .txt-act.edit{ color:var(--indigo); }
  .txt-act.del{ color:var(--danger); margin-left:14px; }
  .txt-act:hover{ text-decoration:underline; }
  .avatar{ width:30px; height:30px; border-radius:50%; background:linear-gradient(135deg,#fb923c,#f472b6); display:inline-flex; align-items:center; justify-content:center; color:#fff; font-size:12px; font-weight:800; }

  /* sidebar */
  .sidebar{ width:196px; background:#fafbfc; border-right:1px solid var(--line-2); padding:72px 12px 12px; overflow-y:auto; }
  .side-title{ font-size:11px; color:var(--mut); padding:12px 12px 4px; letter-spacing:.4px; font-weight:800; }
  .side-sep{ height:1px; background:var(--line-2); margin:8px; }
  .side-item{ font-size:13px; color:var(--txt); padding:8px 12px; border-radius:8px; margin:1px 0; cursor:pointer; display:flex; align-items:center; gap:9px; font-weight:500; }
  .side-item:hover{ background:var(--line-2); }
  .side-item.active{ background:#ede9fe; color:#6d28d9; font-weight:700; }

  /* main */
  .main{ flex:1; padding:74px 30px 24px; overflow-y:auto; background:var(--bg); position:relative; }
  .main-head{ display:flex; align-items:center; margin-bottom:4px; }
  .main-title{ font-size:21px; font-weight:800; color:var(--ink); }
  .main-sub{ font-size:13px; color:var(--mut); margin-bottom:16px; }

  /* buttons */
  .btn{ border:none; border-radius:9px; font-size:13px; font-weight:700; cursor:pointer; padding:9px 15px; display:inline-flex; align-items:center; gap:6px; transition:.15s; white-space:nowrap; }
  .btn.primary{ background:var(--indigo); color:#fff; box-shadow:var(--shadow-sm); }
  .btn.primary:hover{ background:var(--indigo-d); }
  .btn.ghost{ background:#fff; color:var(--txt); border:1px solid var(--line); }
  .btn.ghost:hover{ border-color:#c7d2fe; color:var(--indigo-d); }
  .btn.sm{ padding:7px 12px; font-size:12px; }
  .btn.danger-ghost{ background:#fff; color:var(--danger); border:1px solid #fecaca; }
  .btn.danger-ghost:hover{ background:#fef2f2; }

  /* tabs */
  .tabs{ display:flex; gap:2px; border-bottom:1px solid var(--line); margin-bottom:16px; }
  .tab{ padding:10px 16px; font-size:14px; font-weight:700; color:var(--mut); cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px; transition:.15s; }
  .tab:hover{ color:var(--txt); }
  .tab.active{ color:#6d28d9; border-bottom-color:#6d28d9; }

  /* toolbar：搜索 + 下拉 */
  .toolbar{ display:flex; align-items:center; gap:10px; margin-bottom:16px; flex-wrap:wrap; }
  .search{ position:relative; flex:0 0 300px; }
  .search input{ width:100%; border:1px solid var(--line); border-radius:9px; padding:9px 12px 9px 34px; font-size:13px; background:#fff; }
  .search input:focus{ outline:none; border-color:#a5b4fc; box-shadow:0 0 0 3px rgba(99,102,241,.12); }
  .search .ic{ position:absolute; left:11px; top:50%; transform:translateY(-50%); color:var(--mut); font-size:14px; }
  .spacer{ flex:1; }

  /* 自定义下拉 select */
  .dd{ position:relative; }
  .dd-btn{ display:inline-flex; align-items:center; gap:8px; background:#fff; border:1px solid var(--line); border-radius:9px; padding:9px 12px; font-size:13px; color:var(--txt); cursor:pointer; font-weight:600; min-width:120px; justify-content:space-between; transition:.15s; }
  .dd-btn:hover{ border-color:#c7d2fe; }
  .dd-btn.on{ border-color:#a5b4fc; box-shadow:0 0 0 3px rgba(99,102,241,.12); }
  .dd-btn .cur{ color:var(--ink); }
  .dd-btn .cur.ph{ color:var(--mut); font-weight:500; }
  .dd-btn .caret{ color:var(--mut); font-size:10px; transition:.2s; }
  .dd-btn.on .caret{ transform:rotate(180deg); }
  .dd-menu{ position:absolute; top:calc(100% + 6px); left:0; min-width:100%; background:#fff; border:1px solid var(--line); border-radius:11px; box-shadow:var(--shadow-md); padding:6px; z-index:30; display:none; max-height:280px; overflow-y:auto; }
  .dd-menu.show{ display:block; animation:pop .14s ease; }
  @keyframes pop{ from{opacity:0; transform:translateY(-4px);} to{opacity:1; transform:translateY(0);} }
  .dd-opt{ display:flex; align-items:center; gap:8px; padding:8px 10px; border-radius:8px; font-size:13px; color:var(--txt); cursor:pointer; white-space:nowrap; }
  .dd-opt:hover{ background:var(--line-2); }
  .dd-opt.sel{ background:#ede9fe; color:#6d28d9; font-weight:700; }
  .dd-opt .ck{ margin-left:auto; color:#6d28d9; font-size:12px; opacity:0; }
  .dd-opt.sel .ck{ opacity:1; }
  .dd-dot{ width:9px; height:9px; border-radius:50%; flex-shrink:0; }

  /* 表格 */
  .table{ width:100%; border-collapse:separate; border-spacing:0; background:#fff; border:1px solid var(--line); border-radius:12px; overflow:hidden; box-shadow:var(--shadow-sm); }
  .table th{ background:#fafbfc; font-size:12px; font-weight:700; color:var(--sub); text-align:left; padding:12px 14px; border-bottom:1px solid var(--line); }
  .table td{ padding:13px 14px; font-size:13px; border-bottom:1px solid var(--line-2); vertical-align:middle; }
  .table tr:last-child td{ border-bottom:none; }
  .table tbody tr{ transition:.12s; }
  .table tbody tr:hover{ background:#fafbff; }
  .cell-name{ display:flex; align-items:center; gap:11px; }
  .cell-ico{ width:36px; height:36px; border-radius:9px; display:inline-flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0; }
  .cell-name .nm{ font-weight:700; color:var(--ink); font-size:13.5px; }
  .cell-name .dz{ font-size:11.5px; color:var(--mut); margin-top:1px; max-width:280px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  .pill{ font-size:11px; padding:2.5px 9px; border-radius:20px; font-weight:700; display:inline-flex; align-items:center; gap:4px; white-space:nowrap; }
  .pill.gray{ background:var(--line-2); color:var(--sub); }
  .pill.green{ background:#dcfce7; color:var(--ok); }
  .pill.amber{ background:#fef3c7; color:var(--warn); }
  .pill.indigo{ background:#ede9fe; color:#6d28d9; }
  .pill.blue{ background:#dbeafe; color:#2563eb; }
  .pill.line{ background:#fff; border:1px solid #c7d2fe; color:#6d28d9; }

  .tag-chip{ font-size:11px; padding:2px 8px; border-radius:6px; background:#fff; border:1px solid #c7d2fe; color:#6d28d9; font-weight:600; margin-right:4px; display:inline-block; }
  .cat-chip{ font-size:11px; padding:2px 9px; border-radius:20px; font-weight:700; display:inline-flex; align-items:center; gap:5px; }

  .row-acts{ display:flex; align-items:center; gap:4px; justify-content:flex-end; }
  .icon-btn{ width:30px; height:30px; border-radius:7px; display:inline-flex; align-items:center; justify-content:center; cursor:pointer; color:var(--sub); font-size:15px; transition:.12s; }
  .icon-btn:hover{ background:var(--line-2); color:var(--indigo-d); }
  .icon-btn.danger:hover{ background:#fef2f2; color:var(--danger); }
  .link-act{ font-size:12.5px; color:var(--indigo); font-weight:700; cursor:pointer; }
  .link-act:hover{ text-decoration:underline; }

  .empty{ color:var(--mut); font-size:13px; padding:56px 0; text-align:center; background:#fff; border:1px dashed var(--line); border-radius:12px; }

  /* switch */
  .switch{ position:relative; display:inline-flex; cursor:pointer; }
  .switch input{ position:absolute; opacity:0; width:0; height:0; }
  .switch .sw-track{ width:36px; height:20px; border-radius:20px; background:#cbd5e1; transition:.2s; position:relative; }
  .switch .sw-track::after{ content:""; position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%; background:#fff; transition:.2s; box-shadow:var(--shadow-sm); }
  .switch input:checked + .sw-track{ background:var(--indigo); }
  .switch input:checked + .sw-track::after{ transform:translateX(16px); }

  /* modal */
  .overlay{ position:absolute; inset:0; background:rgba(15,23,42,.42); backdrop-filter:blur(1px); z-index:40; display:none; align-items:center; justify-content:center; }
  .overlay.show{ display:flex; animation:fade .16s ease; }
  @keyframes fade{ from{opacity:0;} to{opacity:1;} }
  .modal{ background:#fff; border-radius:18px; width:600px; max-width:94%; max-height:88%; display:flex; flex-direction:column; overflow:hidden; box-shadow:var(--shadow-lg); animation:rise .2s cubic-bezier(.2,.9,.3,1); }
  @keyframes rise{ from{opacity:0; transform:translateY(12px) scale(.98);} to{opacity:1; transform:none;} }
  .modal.wide{ width:680px; }
  .modal-head{ padding:20px 24px 6px; display:flex; align-items:flex-start; }
  .modal-head .mt{ font-size:18px; font-weight:800; color:var(--ink); }
  .modal-head .ms{ font-size:12.5px; color:var(--mut); margin-top:3px; }
  .modal-head .x{ margin-left:auto; cursor:pointer; color:var(--mut); font-size:20px; width:32px; height:32px; border-radius:8px; display:flex; align-items:center; justify-content:center; }
  .modal-head .x:hover{ background:var(--line-2); }
  .modal-body{ padding:14px 24px 8px; overflow-y:auto; flex:1; }
  .modal-foot{ padding:16px 24px; display:flex; align-items:center; gap:10px; justify-content:flex-end; border-top:1px solid var(--line-2); }

  /* form */
  .field{ margin-bottom:18px; }
  .field > label{ display:block; font-size:13px; font-weight:700; color:var(--txt); margin-bottom:7px; }
  .field label .opt{ color:var(--mut); font-weight:400; }
  .field .hint{ font-size:11.5px; color:var(--mut); margin-top:6px; }
  .inp{ width:100%; border:1px solid var(--line); border-radius:10px; padding:10px 12px; font-size:13px; font-family:inherit; background:#fff; transition:.15s; }
  .inp:focus{ outline:none; border-color:#a5b4fc; box-shadow:0 0 0 3px rgba(99,102,241,.12); }
  textarea.inp{ min-height:78px; resize:vertical; }
  .mono{ font-family:"SF Mono",Menlo,Consolas,monospace; font-size:12px; }

  .note{ font-size:12px; border-radius:9px; padding:10px 12px; line-height:1.6; }
  .note.info{ color:#3730a3; background:#eef2ff; border-left:3px solid var(--indigo); }
  .note.warn{ color:var(--warn); background:#fffbeb; border-left:3px solid #fbbf24; }
  .note.ok{ color:#166534; background:#f0fdf4; border-left:3px solid #4ade80; }

  .kv{ display:grid; grid-template-columns:1fr 1fr 34px; gap:10px; align-items:center; margin-bottom:8px; }
  .kv .del{ color:var(--danger); cursor:pointer; text-align:center; font-size:15px; width:34px; height:38px; display:flex; align-items:center; justify-content:center; border-radius:8px; }
  .kv .del:hover{ background:#fef2f2; }
  .add-line{ border:1px dashed var(--line); background:#fff; border-radius:9px; padding:8px 12px; font-size:12.5px; cursor:pointer; display:inline-flex; gap:6px; color:var(--indigo); font-weight:600; }
  .add-line:hover{ border-color:#a5b4fc; background:#f5f3ff; }

  .seg{ display:inline-flex; background:var(--line-2); border-radius:10px; padding:3px; }
  .seg button{ border:none; background:none; padding:7px 18px; font-size:13px; font-weight:700; color:var(--sub); border-radius:7px; cursor:pointer; transition:.15s; }
  .seg button.on{ background:#fff; color:#6d28d9; box-shadow:var(--shadow-sm); }

  .icon-up{ display:flex; align-items:center; gap:14px; }
  .icon-box{ width:60px; height:60px; border-radius:13px; display:flex; align-items:center; justify-content:center; font-size:26px; flex-shrink:0; border:1px solid var(--line); }
  .up-btn{ border:1px solid var(--line); background:#fff; border-radius:9px; padding:8px 14px; font-size:12.5px; font-weight:700; cursor:pointer; color:var(--txt); }
  .up-btn:hover{ border-color:#c7d2fe; }

  /* 标签/分类管理弹窗行 */
  .mng-add{ border:1.5px dashed var(--line); border-radius:11px; padding:12px; text-align:center; color:var(--indigo); font-weight:700; font-size:13px; cursor:pointer; margin-bottom:12px; }
  .mng-add:hover{ border-color:#a5b4fc; background:#f5f3ff; }
  .mng-row{ display:flex; align-items:center; gap:10px; padding:11px 12px; border:1px solid var(--line-2); border-radius:10px; margin-bottom:8px; }
  .mng-row .nm{ font-size:13.5px; font-weight:600; color:var(--ink); }
  .mng-row .acts{ margin-left:auto; display:flex; gap:2px; }

  /* 分发弹窗 - 用户多选 */
  .user-search{ position:relative; margin-bottom:10px; }
  .user-list{ border:1px solid var(--line); border-radius:11px; max-height:230px; overflow-y:auto; }
  .user-item{ display:flex; align-items:center; gap:10px; padding:10px 13px; border-bottom:1px solid var(--line-2); cursor:pointer; }
  .user-item:last-child{ border-bottom:none; }
  .user-item:hover{ background:var(--bg); }
  .u-ava{ width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:#fff; font-size:12px; font-weight:700; flex-shrink:0; }
  .u-meta .un{ font-size:13px; font-weight:600; color:var(--ink); }
  .u-meta .ud{ font-size:11.5px; color:var(--mut); }
  .u-ck{ margin-left:auto; width:20px; height:20px; border-radius:6px; border:1.5px solid var(--line); display:flex; align-items:center; justify-content:center; color:#fff; font-size:12px; }
  .user-item.sel .u-ck{ background:var(--indigo); border-color:var(--indigo); }
  .chosen-bar{ font-size:12px; color:var(--sub); margin-top:10px; }
  .chosen-bar b{ color:var(--indigo-d); }

  .checkbox{ width:18px; height:18px; border-radius:5px; border:1.5px solid var(--line); display:inline-flex; align-items:center; justify-content:center; color:#fff; font-size:11px; cursor:pointer; flex-shrink:0; }
  .checkbox.on{ background:var(--indigo); border-color:var(--indigo); }

  /* toast */
  /* 列内分类可点击 */
  .cat-cell{ display:inline-flex; align-items:center; gap:6px; cursor:pointer; }
  .cat-cell .cat-tag{ color:var(--mut); font-size:13px; opacity:0; transition:.12s; }
  .table tbody tr:hover .cat-cell .cat-tag{ opacity:1; }
  .cat-cell:hover .cat-tag{ color:var(--indigo-d); }
  /* 设置分类弹窗选项 */
  .cat-pick{ display:inline-flex; align-items:center; gap:7px; padding:8px 14px; border-radius:20px; font-size:13px; font-weight:600; color:var(--txt); border:1px solid var(--line); cursor:pointer; transition:.12s; }
  .cat-pick:hover{ border-color:#c7d2fe; }
  .cat-pick.on{ border-color:var(--indigo); background:#f5f3ff; color:#4338ca; }
  /* 只读表单项 */
  .inp.ro,.icon-box.ro{ background:var(--bg); color:var(--sub); cursor:not-allowed; }
  textarea.inp.ro{ resize:none; }
  .up-btn:disabled{ opacity:.5; cursor:not-allowed; }
  /* 选人组件 picker */
  .picker{ display:grid; grid-template-columns:1fr 1fr; gap:0; padding:0; }
  .pk-left{ border-right:1px solid var(--line-2); padding:16px 18px; max-height:420px; overflow-y:auto; }
  .pk-right{ padding:16px 18px; max-height:420px; display:flex; flex-direction:column; }
  .picker-search{ position:relative; margin-bottom:12px; }
  .picker-search input{ width:100%; border:1px solid var(--line); border-radius:9px; padding:9px 12px 9px 34px; font-size:13px; background:#fff; }
  .picker-search input:focus{ outline:none; border-color:#a5b4fc; box-shadow:0 0 0 3px rgba(99,102,241,.12); }
  .picker-search .ic{ position:absolute; left:11px; top:50%; transform:translateY(-50%); color:var(--mut); font-size:14px; }
  .pk-item{ display:flex; align-items:center; gap:10px; padding:9px 6px; border-radius:8px; cursor:pointer; }
  .pk-item:hover{ background:var(--bg); }
  .dept-ico{ width:26px; height:26px; border-radius:50%; background:#2563eb; color:#fff; display:inline-flex; align-items:center; justify-content:center; font-size:13px; flex-shrink:0; }
  .pk-name{ font-size:13.5px; color:var(--ink); font-weight:500; }
  .pk-sub{ display:block; font-size:11.5px; color:var(--mut); }
  .pk-tabs{ display:flex; gap:0; border:1px solid var(--line); border-radius:9px; overflow:hidden; margin-bottom:12px; }
  .pk-tab{ flex:1; text-align:center; padding:8px; font-size:13px; font-weight:700; color:var(--sub); cursor:pointer; }
  .pk-tab.on{ background:#eef2ff; color:var(--indigo-d); }
  .pk-chosen{ flex:1; overflow-y:auto; }
  .chosen-item{ display:flex; align-items:center; gap:10px; padding:9px 4px; }
  .chosen-item .rm{ margin-left:auto; color:var(--mut); font-size:16px; cursor:pointer; padding:0 4px; }
  .chosen-item .rm:hover{ color:var(--danger); }
  .toast{ position:absolute; bottom:26px; left:50%; transform:translateX(-50%) translateY(8px); background:var(--ink); color:#fff; padding:11px 20px; border-radius:10px; font-size:13px; z-index:60; opacity:0; transition:.24s; pointer-events:none; box-shadow:var(--shadow-md); }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="page-label">
  <span class="b-num">2</span>
  <span class="b-title">Workhub Studio · MCP</span>
  <span class="b-desc">租户配置 · 内置 MCP 配 Headers（共用账号）+ 定向分发｜自定义 MCP｜列内配置分类｜绑定 Agent 使用</span>
</div>

<div class="app">
  <div class="topbar">
    <div class="logo"><span class="logo-icon">W</span>Workhub Studio</div>
    <div class="right">
      <span class="tenant-switch">🏢 网易－效率工程部 <span style="color:var(--mut);font-size:10px;">▾</span></span>
      <span class="nav-link">🧭 服务导航</span>
      <span class="avatar">张</span>
    </div>
  </div>

  <div class="sidebar">
    <div class="side-title">AI 工厂</div>
    <div class="side-item">💬 对话</div>
    <div class="side-item">🤖 Bots</div>
    <div class="side-item">🧠 Agents</div>
    <div class="side-item">✨ Skills</div>
    <div class="side-item">🧬 Models</div>
    <div class="side-item">📝 Prompts</div>
    <div class="side-item active">🔌 MCP</div>
    <div class="side-item">📖 知识库</div>
    <div class="side-item">⚡ 自动化任务</div>
    <div class="side-sep"></div>
    <div class="side-title">运行观测</div>
    <div class="side-item">📊 评测</div>
    <div class="side-item">🗂 会话</div>
  </div>

  <div class="main" id="main"></div>

  <div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
  <div class="toast" id="toast"></div>
</div>

<script>
/* ============ 数据 ============ */
const authMeta = {
  popo:  { pill:"green",  label:"POPO 静默" },
  oauth: { pill:"amber",  label:"OAuth 外跳" },
  api:   { pill:"indigo", label:"自定义 API" }
};
// 分类（同 Skills：单选 + 颜色圆点）
const categories = [
  { id:"c_all",   name:"全部",   color:"#94a3b8", fixed:true },
  { id:"c_gen",   name:"通用",   color:"#64748b" },
  { id:"c_office",name:"办公协同", color:"#6366f1" },
  { id:"c_data",  name:"数据查询", color:"#0ea5e9" },
  { id:"c_fin",   name:"财务",   color:"#f97316" },
  { id:"c_legal", name:"法务",   color:"#dc2626" },
  { id:"c_dev",   name:"研发",   color:"#10b981" }
];
// 部门树（定向分发用，同选人组件）
const depts = [
  { id:"d_fin", name:"财务部" }, { id:"d_hr", name:"人力资源部" }, { id:"d_adm", name:"行政部" },
  { id:"d_ir", name:"投资者关系部" }, { id:"d_dev", name:"企业发展部" }, { id:"d_exec", name:"执行办公室" },
  { id:"d_biz", name:"综合业务部" }, { id:"d_law", name:"法务部" }, { id:"d_pur", name:"商务采购部" },
  { id:"d_audit", name:"内审部" }, { id:"d_agri", name:"农业事业部" }
];
const users = [
  { id:"u1", name:"张振", mail:"zhangzhen@corp", dept:"财务部" },
  { id:"u2", name:"朱弈", mail:"zhuyi@corp", dept:"财务部" },
  { id:"u3", name:"李扬", mail:"liyang@corp", dept:"内审部" },
  { id:"u4", name:"傅云辰", mail:"fuyunchen@corp", dept:"内审部" },
  { id:"u5", name:"施羽婷", mail:"shiyt@corp", dept:"法务部" },
  { id:"u6", name:"林锦珊", mail:"linjs@corp", dept:"财务部" }
];

/* 内置 MCP：超管上架分配。auth=鉴权类型；tenantHeaders=是否配 Headers（共用账号）；
   distDepts/distUsers=定向分发目标；boundAgents=已绑定 Agent 数；cat=分类id */
const builtin = [
  { name:"POPO 云空间", ico:"📁", bg:"#e0f2fe", desc:"读写 POPO 云文档、表格、多维表与文件夹", auth:"popo", cat:"c_office", boundAgents:6, distDepts:[], distUsers:[] },
  { name:"POPO 日程",   ico:"📅", bg:"#ede9fe", desc:"查询日程、预约会议与会议室、节假日查询", auth:"popo", cat:"c_office", boundAgents:3, distDepts:[], distUsers:[] },
  { name:"POPO 任务",   ico:"✅", bg:"#dcfce7", desc:"创建 / 更新任务与子任务、查询任务列表", auth:"popo", cat:"c_office", boundAgents:2, distDepts:[], distUsers:[] },
  { name:"易协作",     ico:"🤝", bg:"#fef3c7", desc:"协同文档、项目与流程审批的接入", auth:"popo", cat:"c_office", boundAgents:1, distDepts:[], distUsers:[] },
  { name:"KM 知识管理", ico:"📚", bg:"#e0e7ff", desc:"搜索知识、阅读文章，与 KM 系统交互", auth:"popo", cat:"c_gen", boundAgents:4, distDepts:[], distUsers:[] },
  { name:"网易邮箱",   ico:"✉️", bg:"#eef2f7", desc:"读取邮件、搜索往来和发送邮件", auth:"oauth", cat:"c_office", boundAgents:2, tenantHeaders:true, headers:[{k:"Authorization",v:"Bearer ***"}], distDepts:["行政部"], distUsers:[] },
  { name:"GitHub",     ico:"🐙", bg:"#f1f5f9", desc:"查询代码、Issue、PR 和仓库信息", auth:"oauth", cat:"c_dev", boundAgents:1, distDepts:[], distUsers:[] },
  { name:"Figma",      ico:"🎨", bg:"#fae8ff", desc:"读取设计文件、页面和组件信息", auth:"oauth", cat:"c_dev", boundAgents:0, distDepts:[], distUsers:[] },
  { name:"CodeMaker",  ico:"⟨⟩", bg:"#e0f2fe", desc:"调用研发代码生成与分析能力", auth:"api", cat:"c_dev", boundAgents:2, distDepts:[], distUsers:[] },
  { name:"北大法宝",   ico:"⚖️", bg:"#f1f5f9", desc:"检索法律法规、案例与司法解释", auth:"api", cat:"c_legal", boundAgents:1, tenantHeaders:true, headers:[{k:"apikey",v:"***"}], distDepts:["法务部"], distUsers:[] },
  { name:"企查查",     ico:"🏢", bg:"#eef2f7", desc:"查询企业工商、股东、风险与关系图谱", auth:"api", cat:"c_data", boundAgents:3, tenantHeaders:true, headers:[{k:"Token",v:"***"}], distDepts:["财务部","法务部"], distUsers:["张振"] }
];
// 自定义 MCP
const custom = [
  { name:"内部 CRM MCP", ico:"🔌", bg:"#eef2ff", desc:"对接部门内部 CRM 的客户与订单数据", transport:"http", url:"https://mcp.crm.internal/mcp", headers:[{k:"Authorization",v:"Bearer ***"}], cat:"c_data", boundAgents:1, distDepts:[], distUsers:[] }
];

/* ============ 状态 ============ */
let tab = "builtin";
let fltName = "";
let fltCat = "c_all";
const main = document.getElementById("main");
const overlay = document.getElementById("overlay");
const modal = document.getElementById("modal");

const catById = id => categories.find(c=>c.id===id);

/* ============ 顶层渲染 ============ */
function render(){
  const list = tab==="builtin" ? builtin : custom;
  main.innerHTML = `
    <div class="main-head">
      <span class="main-title">MCP</span>
      <div style="margin-left:auto;display:flex;gap:8px;">
        <button class="btn ghost" onclick="openMngCat()">🎨 管理分类</button>
        ${tab==="custom" ? `<button class="btn primary" onclick="openCustom(-1)">＋ 添加自定义 MCP</button>` : ""}
      </div>
    </div>

    <div class="tabs">
      <div class="tab ${tab==='builtin'?'active':''}" onclick="switchTab('builtin')">内置 MCP</div>
      <div class="tab ${tab==='custom'?'active':''}" onclick="switchTab('custom')">自定义 MCP</div>
    </div>

    <div class="toolbar">
      <div class="search"><span class="ic">🔍</span><input placeholder="搜索 MCP 名称" value="${fltName}" oninput="onSearch(this.value)"></div>
      ${ddCategory()}
      ${(fltName||fltCat!=='c_all') ? `<button class="btn ghost sm" onclick="resetFlt()">重置</button>` : ""}
    </div>

    ${renderTable(list)}
  `;
}
function switchTab(t){ tab=t; render(); }
function onSearch(v){ fltName=v; render(); }
function resetFlt(){ fltName=""; fltCat="c_all"; render(); }

/* ---- 自定义下拉：分类 ---- */
function ddCategory(){
  const cur = catById(fltCat);
  return `<div class="dd" id="ddCat">
    <div class="dd-btn" onclick="toggleDD('ddCat',event)">
      <span style="display:inline-flex;align-items:center;gap:7px;">
        <span class="dd-dot" style="background:${cur.color}"></span>
        <span class="cur">${fltCat==='c_all'?'全部分类':cur.name}</span>
      </span>
      <span class="caret">▼</span>
    </div>
    <div class="dd-menu">
      ${categories.map(c=>`<div class="dd-opt ${c.id===fltCat?'sel':''}" onclick="pickCat('${c.id}')">
        <span class="dd-dot" style="background:${c.color}"></span>${c.id==='c_all'?'全部分类':c.name}<span class="ck">✓</span>
      </div>`).join("")}
    </div>
  </div>`;
}
function pickCat(id){ fltCat=id; closeDD(); render(); }

function toggleDD(id,e){ e.stopPropagation(); const el=document.getElementById(id); const menu=el.querySelector('.dd-menu'); const btn=el.querySelector('.dd-btn'); const open=menu.classList.contains('show'); closeDD(); if(!open){ menu.classList.add('show'); btn.classList.add('on'); } }
function closeDD(){ document.querySelectorAll('.dd-menu.show').forEach(m=>m.classList.remove('show')); document.querySelectorAll('.dd-btn.on').forEach(b=>b.classList.remove('on')); }
document.addEventListener('click', closeDD);

/* ============ 表格 ============ */
function filtered(list){
  return list.filter(m=>{
    if(fltName){ const q=fltName.toLowerCase(); if(!m.name.toLowerCase().includes(q)) return false; }
    if(fltCat!=='c_all' && m.cat!==fltCat) return false;
    return true;
  });
}
function renderTable(list){
  const rows = filtered(list);
  if(!rows.length) return `<div class="empty">${tab==='custom'?'还没有自定义 MCP，点右上角「添加自定义 MCP」创建。':'没有匹配的 MCP，调整筛选试试。'}</div>`;
  const isB = tab==='builtin';
  return `<table class="table">
    <thead><tr>
      <th style="width:${isB?'32%':'34%'}">MCP</th>
      <th style="width:12%">鉴权类型</th>
      <th style="width:15%">分类</th>
      <th style="width:19%">${isB?'定向分发':'Headers'}</th>
      <th style="width:10%">绑定 Agent</th>
      <th style="width:12%;text-align:right;">操作</th>
    </tr></thead>
    <tbody>
      ${rows.map(m=>{ const i=list.indexOf(m); return isB?rowBuiltin(m,i):rowCustom(m,i); }).join("")}
    </tbody>
  </table>`;
}
function catCell(m,i){ const c=catById(m.cat)||catById('c_gen');
  return `<span class="cat-cell" onclick="openCatMcp(${i},'${tab}')" title="点击设置分类">
    <span class="cat-chip" style="background:${c.color}1a;color:${c.color};"><span class="dd-dot" style="background:${c.color}"></span>${c.name}</span>
    <span class="cat-tag" title="设置分类">🏷</span>
  </span>`;
}
function agentCell(m){ return m.boundAgents>0 ? `<span class="pill blue">${m.boundAgents} 个</span>` : `<span class="pill gray">未绑定</span>`; }
function distSummary(m){
  const names=[...(m.distDepts||[]),...(m.distUsers||[])];
  if(!names.length) return `<span style="font-size:12px;color:var(--mut);">未分发</span>`;
  const show=names.slice(0,3).map(n=>`<span class="tag-chip">${n}</span>`).join("");
  return `<div style="display:flex;flex-wrap:wrap;gap:4px;align-items:center;">${show}${names.length>3?`<span class="pill gray">...</span>`:""}</div>`;
}

function rowBuiltin(m,i){
  const meta=authMeta[m.auth];
  const acct = m.tenantHeaders ? distSummary(m) : `<span style="font-size:12px;color:var(--mut);">用户自授权</span>`;
  return `<tr>
    <td><div class="cell-name"><span class="cell-ico" style="background:${m.bg}">${m.ico}</span><div><div class="nm">${m.name}</div><div class="dz">${m.desc}</div></div></div></td>
    <td><span class="pill ${meta.pill}">${meta.label}</span></td>
    <td>${catCell(m,i)}</td>
    <td>${acct}</td>
    <td>${agentCell(m)}</td>
    <td><div class="row-acts">
      <span class="txt-act edit" onclick="openBuiltinEdit(${i})">编辑</span>
      ${m.tenantHeaders?`<span class="txt-act edit" style="margin-left:14px;" onclick="openDist(${i},'builtin')">定向分发</span>`:``}
    </div></td>
  </tr>`;
}
function rowCustom(m,i){
  return `<tr>
    <td><div class="cell-name"><span class="cell-ico" style="background:${m.bg}">${m.ico}</span><div><div class="nm">${m.name}</div><div class="dz">${m.desc||m.url}</div></div></div></td>
    <td><span class="pill gray">${(m.transport||'http').toUpperCase()}</span></td>
    <td>${catCell(m,i)}</td>
    <td>${m.headers&&m.headers.length?`<span class="pill green">已配共用账号</span>`:`<span class="pill gray">无</span>`}</td>
    <td>${agentCell(m)}</td>
    <td><div class="row-acts">
      <span class="txt-act edit" onclick="openCustom(${i})">编辑</span>
      ${m.headers&&m.headers.length?`<span class="txt-act edit" style="margin-left:14px;" onclick="openDist(${i},'custom')">定向分发</span>`:``}
      <span class="txt-act del" onclick="delCustom(${i})">删除</span>
    </div></td>
  </tr>`;
}

/* ============ 弹窗：内置 MCP 编辑（样式同超管，不可编辑项置灰，仅 Headers 可改） ============ */
let bForm={ idx:-1, headers:[] };
function openBuiltinEdit(i){
  const m=builtin[i];
  bForm={ idx:i, headers:(m.headers?m.headers.map(h=>({...h})):[{k:"",v:""}]) };
  showModal(); renderBuiltinEdit();
}
function renderBuiltinEdit(){
  const m=builtin[bForm.idx];
  const meta=authMeta[m.auth];
  const hintTxt = m.auth==="popo"
    ? "POPO 静默类默认用户以自己 POPO 身份静默授权；如需全员共用统一账号，可在此配置 Headers（配置即表示提供公共账号）。"
    : "填写后，被<b>定向分发</b>的部门 / 人员共用该账号免鉴权直用；留空则每个用户使用时各自完成账号鉴权。";
  modal.className="modal wide";
  modal.innerHTML=`
    <div class="modal-head"><div><div class="mt">编辑 MCP</div></div><span class="x" onclick="closeModal()">×</span></div>
    <div class="modal-body">
      <div class="field"><label>图标</label>
        <div class="icon-up"><div class="icon-box ro" style="background:${m.bg}">${m.ico}</div>
          <div><button class="up-btn" disabled>⬆ 上传图标</button><div class="hint">内置 MCP 图标由超管上架时设定，不可修改</div></div></div>
      </div>
      <div class="field"><label>服务器名称</label><input class="inp ro" value="${m.name}" disabled></div>
      <div class="field"><label>描述</label><textarea class="inp ro" disabled>${m.desc}</textarea></div>
      <div class="field"><label>鉴权类型</label><div><span class="pill ${meta.pill}">${meta.label}</span></div></div>
      <div class="field"><label>Headers <span class="opt">填写即表示该 MCP 提供公共账号</span></label>
        <div class="note info" style="margin-bottom:10px;">${hintTxt}</div>
        ${bForm.headers.map((hd,i)=>`<div class="kv">
          <input class="inp" placeholder="Header 名称，如 Authorization" value="${hd.k}" oninput="bForm.headers[${i}].k=this.value">
          <input class="inp mono" placeholder="Header 值，如 Bearer xxx" value="${hd.v}" oninput="bForm.headers[${i}].v=this.value">
          <span class="del" onclick="bHDel(${i})">🗑</span></div>`).join("")}
        <span class="add-line" onclick="bHAdd()">＋ 添加 Header</span>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn ghost" onclick="closeModal()">取消</button>
      <button class="btn primary" onclick="saveBuiltinEdit()">保存</button>
    </div>`;
}
function bHAdd(){ bForm.headers.push({k:"",v:""}); renderBuiltinEdit(); }
function bHDel(i){ bForm.headers.splice(i,1); if(!bForm.headers.length) bForm.headers.push({k:"",v:""}); renderBuiltinEdit(); }
function saveBuiltinEdit(){
  const m=builtin[bForm.idx];
  const valid=bForm.headers.filter(h=>h.k.trim());
  m.headers=valid; m.tenantHeaders=valid.length>0;
  if(!valid.length){ m.distDepts=[]; m.distUsers=[]; }
  toast(valid.length?"已保存 Headers（共用账号）":"已清空 Headers");
  closeModal(); render();
}

/* ============ 弹窗：定向分发（选择部门 / 人员） ============ */
let dForm={ idx:-1, type:"builtin", tab:"dept", depts:[], usersSel:[], q:"" };
function openDist(i,type){
  const m=(type==='builtin'?builtin:custom)[i];
  dForm={ idx:i, type, tab:"dept", depts:[...(m.distDepts||[])], usersSel:[...(m.distUsers||[])], q:"" };
  showModal(); renderDist();
}
function renderDist(){
  modal.className="modal wide";
  const q=dForm.q.trim().toLowerCase();
  const uList=users.filter(u=>!q||u.name.toLowerCase().includes(q)||u.mail.toLowerCase().includes(q));
  const allDept = dForm.depts.length===depts.length;
  const left = `
    <div class="picker-search"><span class="ic">🔍</span><input placeholder="请输入人员姓名或邮箱" value="${dForm.q}" oninput="dForm.q=this.value;renderDist()"></div>
    ${!q?`
    <label class="pk-item" onclick="toggleAllDept()"><span class="checkbox ${allDept?'on':''}">${allDept?'✓':''}</span><span class="pk-name" style="font-weight:700;">全部部门</span></label>
    ${depts.map(d=>`<label class="pk-item" onclick="toggleDept('${d.name}')"><span class="checkbox ${dForm.depts.includes(d.name)?'on':''}">${dForm.depts.includes(d.name)?'✓':''}</span><span class="dept-ico">🏢</span><span class="pk-name">${d.name}</span></label>`).join("")}
    `:`
    ${uList.length?uList.map(u=>`<label class="pk-item" onclick="toggleUser('${u.name}')"><span class="checkbox ${dForm.usersSel.includes(u.name)?'on':''}">${dForm.usersSel.includes(u.name)?'✓':''}</span><span class="u-ava" style="background:#6366f1">${u.name[0]}</span><span><span class="pk-name">${u.name}</span><span class="pk-sub">${u.mail} · ${u.dept}</span></span></label>`).join(""):`<div class="empty" style="padding:30px 0;border:none;">无匹配人员</div>`}
    `}`;
  const chosen = dForm.tab==="dept"
    ? (dForm.depts.length?dForm.depts.map(n=>`<div class="chosen-item"><span class="dept-ico">🏢</span><span class="pk-name">${n}</span><span class="rm" onclick="toggleDept('${n}')">×</span></div>`).join(""):`<div class="empty" style="border:none;padding:40px 0;">暂无部门</div>`)
    : (dForm.usersSel.length?dForm.usersSel.map(n=>`<div class="chosen-item"><span class="u-ava" style="background:#6366f1">${n[0]}</span><span class="pk-name">${n}</span><span class="rm" onclick="toggleUser('${n}')">×</span></div>`).join(""):`<div class="empty" style="border:none;padding:40px 0;">暂无人员</div>`);
  modal.innerHTML=`
    <div class="modal-head"><div><div class="mt">定向分发</div><div class="ms">选择部门 / 人员，被选中者创建 Agent 时可见该 MCP 并免鉴权直用（共用已配账号）</div></div><span class="x" onclick="closeModal()">×</span></div>
    <div class="modal-body picker">
      <div class="pk-left">${left}</div>
      <div class="pk-right">
        <div class="pk-tabs">
          <div class="pk-tab ${dForm.tab==='dept'?'on':''}" onclick="dForm.tab='dept';renderDist()">已选部门(${dForm.depts.length})</div>
          <div class="pk-tab ${dForm.tab==='user'?'on':''}" onclick="dForm.tab='user';renderDist()">已选人员(${dForm.usersSel.length})</div>
        </div>
        <div class="pk-chosen">${chosen}</div>
      </div>
    </div>
    <div class="modal-foot"><button class="btn ghost" onclick="closeModal()">取消</button><button class="btn primary" onclick="saveDist()">确定</button></div>`;
}
function toggleDept(n){ const i=dForm.depts.indexOf(n); if(i>=0)dForm.depts.splice(i,1); else dForm.depts.push(n); renderDist(); }
function toggleAllDept(){ dForm.depts = dForm.depts.length===depts.length ? [] : depts.map(d=>d.name); renderDist(); }
function toggleUser(n){ const i=dForm.usersSel.indexOf(n); if(i>=0)dForm.usersSel.splice(i,1); else dForm.usersSel.push(n); renderDist(); }
function saveDist(){ const m=(dForm.type==='builtin'?builtin:custom)[dForm.idx]; m.distDepts=[...dForm.depts]; m.distUsers=[...dForm.usersSel]; const total=m.distDepts.length+m.distUsers.length; toast(total?`已分发给 ${m.distDepts.length} 个部门 · ${m.distUsers.length} 人`:"已清空分发范围"); closeModal(); render(); }

/* ============ 弹窗：自定义 MCP ============ */
let cForm={ idx:-1, mode:"form", transport:"http", name:"", note:"", url:"", headers:[], json:"", ico:"🔌", bg:"#eef2ff" };
function openCustom(i){
  if(i>=0){ const m=custom[i];
    const hObj={}; (m.headers||[]).forEach(h=>{ if(h.k)hObj[h.k]=h.v; });
    const jsonStr=JSON.stringify({name:m.name,transport:m.transport||"http",url:m.url||"",...(Object.keys(hObj).length?{headers:hObj}:{})},null,2);
    cForm={ idx:i, mode:"form", transport:m.transport||"http", name:m.name, note:m.desc||"", url:m.url||"", headers:(m.headers?m.headers.map(h=>({...h})):[]), json:jsonStr, ico:m.ico, bg:m.bg };
  } else cForm={ idx:-1, mode:"form", transport:"http", name:"", note:"", url:"", headers:[], json:"", ico:"🔌", bg:"#eef2ff" };
  showModal(); renderCustom();
}
function cSetMode(m){ cForm.mode=m; renderCustom(); }
function cSetTransport(t){ cForm.transport=t; renderCustom(); }
function renderCustom(){
  const isNew=cForm.idx<0;
  modal.className="modal wide";
  const formBody=`
    <div class="field"><label>图标 <span class="opt">可选</span></label>
      <div class="icon-up"><div class="icon-box" style="background:${cForm.bg}">${cForm.ico}</div>
        <div><button class="up-btn" onclick="toast('选择本地图片（PNG/JPG，≤1MB）')">⬆ 上传图标</button>
        <div class="hint">未上传使用默认图标</div></div></div>
    </div>
    <div class="field"><label>服务器名称</label><input class="inp" placeholder="如：内部 CRM MCP" value="${cForm.name}" oninput="cForm.name=this.value"></div>
    <div class="field"><label>描述 <span class="opt">可选</span></label><textarea class="inp" placeholder="说明用途，便于 Agent 判断何时调用" oninput="cForm.note=this.value">${cForm.note}</textarea></div>
    <div class="field"><label>传输类型</label>
      <div class="seg">
        <button class="${cForm.transport==='sse'?'on':''}" onclick="cSetTransport('sse')">SSE</button>
        <button class="${cForm.transport==='http'?'on':''}" onclick="cSetTransport('http')">HTTP</button>
      </div>
    </div>
    <div class="field"><label>服务器 URL</label><input class="inp mono" placeholder="${cForm.transport==='sse'?'https://mcp.yourserver.com/sse':'https://mcp.yourserver.com/mcp'}" value="${cForm.url}" oninput="cForm.url=this.value"></div>
    <div class="field"><label>Headers <span class="opt">可行，填写即表示该 MCP 提供共用授权账号</span></label>
      ${cForm.headers.map((hd,i)=>`<div class="kv"><input class="inp" placeholder="Header 名称" value="${hd.k}" oninput="cForm.headers[${i}].k=this.value"><input class="inp mono" placeholder="Header 值" value="${hd.v}" oninput="cForm.headers[${i}].v=this.value"><span class="del" onclick="cHDel(${i})">🗑</span></div>`).join("")}
      <span class="add-line" onclick="cHAdd()">＋ 添加 Header</span>
    </div>`;
  const jsonBody=`
    <div class="note info" style="margin-bottom:12px;">粘贴标准 MCP 配置 json，支持 <b>sse / http</b>，Headers 可不填，填写即表示该 MCP 提供共用授权账号。</div>
    <div class="field"><label>配置 json</label>
      <textarea class="inp mono" style="min-height:210px;" placeholder='{\n  "name": "内部 CRM MCP",\n  "transport": "http",\n  "url": "https://mcp.crm.internal/mcp",\n  "headers": { "Authorization": "Bearer xxx" }\n}' oninput="cForm.json=this.value">${cForm.json}</textarea>
    </div>`;
  modal.innerHTML=`
    <div class="modal-head"><div><div class="mt">${isNew?'添加自定义 MCP':'编辑自定义 MCP'}</div></div><span class="x" onclick="closeModal()">×</span></div>
    <div class="modal-body">
      <div style="margin-bottom:16px;"><div class="seg">
        <button class="${cForm.mode==='form'?'on':''}" onclick="cSetMode('form')">手动配置</button>
        <button class="${cForm.mode==='json'?'on':''}" onclick="cSetMode('json')">粘贴 json</button>
      </div></div>
      ${cForm.mode==='form'?formBody:jsonBody}
    </div>
    <div class="modal-foot">
      ${isNew?'':`<button class="btn danger-ghost" style="margin-right:auto;" onclick="delCustom(${cForm.idx})">删除</button>`}
      <button class="btn ghost" onclick="closeModal()">取消</button>
      <button class="btn primary" onclick="saveCustom()">保存</button>
    </div>`;
}
function cHAdd(){ cForm.headers.push({k:"",v:""}); renderCustom(); }
function cHDel(i){ cForm.headers.splice(i,1); renderCustom(); }
function saveCustom(){
  let rec;
  const keep = cForm.idx>=0?custom[cForm.idx]:{cat:"c_gen",boundAgents:0,distDepts:[],distUsers:[]};
  if(cForm.mode==='json'){
    try{ const o=JSON.parse(cForm.json||"{}"); const hs=o.headers?Object.entries(o.headers).map(([k,v])=>({k,v:String(v)})):[];
      rec={ name:o.name||"自定义 MCP", ico:cForm.ico, bg:cForm.bg, desc:o.note||o.url||"", transport:(o.transport||"http").toLowerCase(), url:o.url||"", headers:hs, cat:keep.cat, boundAgents:keep.boundAgents, distDepts:keep.distDepts, distUsers:keep.distUsers };
    }catch(e){ toast("json 解析失败，请检查格式"); return; }
  } else {
    rec={ name:cForm.name.trim()||"自定义 MCP", ico:cForm.ico, bg:cForm.bg, desc:cForm.note.trim(), transport:cForm.transport, url:cForm.url.trim(), headers:cForm.headers.filter(h=>h.k.trim()), cat:keep.cat, boundAgents:keep.boundAgents, distDepts:keep.distDepts, distUsers:keep.distUsers };
  }
  if(cForm.idx>=0) custom[cForm.idx]=rec; else custom.push(rec);
  toast("已保存自定义 MCP："+rec.name); closeModal(); render();
}
function delCustom(i){ if(!confirm(`确认删除自定义 MCP「${custom[i].name}」？删除后本租户 Agent 将无法调用。`))return; const n=custom[i].name; custom.splice(i,1); closeModal(); toast("已删除："+n); render(); }

/* ============ 弹窗：设置分类（列内点击触发，单选） ============ */
let tForm={ idx:-1, type:"builtin", cat:"" };
function openCatMcp(i,type){
  const m=(type==='builtin'?builtin:custom)[i];
  tForm={ idx:i, type, cat:m.cat };
  showModal(); renderCatMcp();
}
function renderCatMcp(){
  const m=(tForm.type==='builtin'?builtin:custom)[tForm.idx];
  modal.className="modal";
  modal.innerHTML=`
    <div class="modal-head"><div><div class="mt">设置分类 — ${m.name}</div><div class="ms">选择要绑定到该 MCP 的分类</div></div><span class="x" onclick="closeModal()">×</span></div>
    <div class="modal-body">
      <div style="display:flex;flex-wrap:wrap;gap:10px 18px;padding:6px 2px;">
        ${categories.filter(c=>!c.fixed).map(c=>`<span class="cat-pick ${tForm.cat===c.id?'on':''}" onclick="tForm.cat='${c.id}';renderCatMcp()"><span class="dd-dot" style="background:${c.color}"></span>${c.name}</span>`).join("")}
      </div>
    </div>
    <div class="modal-foot"><button class="btn ghost" onclick="closeModal()">取消</button><button class="btn primary" onclick="saveCatMcp()">保存</button></div>`;
}
function saveCatMcp(){ const m=(tForm.type==='builtin'?builtin:custom)[tForm.idx]; m.cat=tForm.cat; toast("已更新分类"); closeModal(); render(); }

/* ============ 弹窗：管理分类 ============ */
function openMngCat(){
  showModal(); modal.className="modal";
  modal.innerHTML=`
    <div class="modal-head"><div><div class="mt">管理分类</div><div class="ms">创建和管理 MCP 分类（复用当前分类逻辑）</div></div><span class="x" onclick="closeModal()">×</span></div>
    <div class="modal-body">
      <div class="mng-add" onclick="toast('新增分类（示意）')">＋ 添加分类</div>
      ${categories.filter(c=>!c.fixed).map(c=>`<div class="mng-row">
        <span class="dd-dot" style="width:12px;height:12px;background:${c.color}"></span>
        <span class="nm">${c.name}</span>
        <span class="acts"><span class="icon-btn" onclick="toast('编辑分类（示意）')">✏️</span><span class="icon-btn danger" onclick="toast('删除分类（示意）')">🗑</span></span>
      </div>`).join("")}
    </div>
    <div class="modal-foot"><button class="btn ghost" onclick="closeModal()">关闭</button></div>`;
}

/* ============ 公共 ============ */
function showModal(){ overlay.classList.add("show"); }
function closeModal(){ overlay.classList.remove("show"); }
overlay.addEventListener('click', e=>{ if(e.target===overlay) closeModal(); });
let toastTimer;
function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove("show"),2400); }

render();
</script>
</body>
</html>
