<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>WorkHub Studio · 租户后台「MCP」· 高保真原型</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #eef2f7; color: #1f2937; padding: 24px 16px 60px; line-height: 1.6; }

  .page-label { max-width: 1400px; margin: 6px auto 10px; display: flex; align-items: center; gap: 10px; }
  .page-label .badge-num { background: #6366f1; color: #fff; width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; }
  .page-label .badge-title { font-size: 18px; font-weight: 700; color: #0f172a; }
  .page-label .badge-desc { font-size: 13px; color: #64748b; margin-left: 4px; }

  .app { max-width: 1400px; margin: 0 auto; background: #fff; border-radius: 14px; overflow: hidden; box-shadow: 0 4px 24px rgba(15,23,42,0.08); border: 1px solid #e5e7eb; height: 880px; display: flex; position: relative; }

  .topbar { position: absolute; top: 0; left: 0; right: 0; height: 56px; background: #fff; border-bottom: 1px solid #f1f5f9; display: flex; align-items: center; padding: 0 24px; z-index: 2; }
  .topbar .logo { display: flex; align-items: center; gap: 8px; font-size: 18px; font-weight: 700; color: #0f172a; }
  .topbar .logo-icon { width: 22px; height: 22px; background: linear-gradient(135deg,#4f46e5,#7c3aed); border-radius: 6px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 12px; font-weight: 700; }
  .tenant-tag { margin-left: 14px; background: #f5f3ff; border: 1px solid #ddd6fe; border-radius: 6px; padding: 5px 12px; font-size: 13px; color: #6d28d9; display: inline-flex; align-items: center; gap: 6px; font-weight: 600; }
  .topbar .right { margin-left: auto; display: flex; align-items: center; gap: 16px; }
  .avatar { width: 30px; height: 30px; border-radius: 50%; background: linear-gradient(135deg,#fb923c,#f472b6); display: inline-flex; align-items: center; justify-content: center; color: #fff; font-size: 12px; font-weight: 700; }

  .sidebar { width: 200px; background: #fafbfc; border-right: 1px solid #f1f5f9; padding: 70px 12px 12px; overflow-y: auto; }
  .side-title { font-size: 11px; color: #94a3b8; padding: 12px 12px 4px; letter-spacing: .5px; font-weight: 700; }
  .side-sep { height: 1px; background: #f1f5f9; margin: 8px 8px; }
  .side-item { font-size: 13px; color: #475569; padding: 8px 12px; border-radius: 6px; margin: 1px 0; cursor: pointer; display: flex; align-items: center; gap: 8px; }
  .side-item:hover { background: #f1f5f9; }
  .side-item.active { background: #ede9fe; color: #6d28d9; font-weight: 600; }

  .main { flex: 1; padding: 70px 28px 24px; overflow-y: auto; background: #f8fafc; position: relative; }
  .main-header { display: flex; align-items: center; margin-bottom: 6px; }
  .main-title { font-size: 22px; font-weight: 700; color: #0f172a; }
  .main-sub { font-size: 13px; color: #94a3b8; margin-bottom: 18px; }
  .btn { border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; padding: 9px 16px; display: inline-flex; align-items: center; gap: 6px; }
  .btn.primary { background: #6366f1; color: #fff; }
  .btn.primary:hover { background: #4f46e5; }
  .btn.ghost { background: #fff; color: #475569; border: 1px solid #e2e8f0; }
  .btn.sm { padding: 6px 12px; font-size: 12px; }

  /* tabs */
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid #e5e7eb; margin-bottom: 18px; }
  .tab { padding: 9px 16px; font-size: 14px; font-weight: 600; color: #94a3b8; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .tab.active { color: #6d28d9; border-bottom-color: #6d28d9; }

  /* 卡片网格 */
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .mcp-card { background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 14px 16px; display: flex; align-items: flex-start; gap: 12px; transition: all .15s; position: relative; }
  .mcp-card:hover { border-color: #c7d2fe; box-shadow: 0 2px 10px rgba(99,102,241,0.08); }
  .mcp-ico { width: 40px; height: 40px; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; background: #f1f5f9; }
  .mcp-info { min-width: 0; flex: 1; }
  .mcp-name { font-size: 14px; font-weight: 700; color: #0f172a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 6px; }
  .mcp-desc { font-size: 12px; color: #94a3b8; margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.45; }
  .mcp-foot { margin-top: 10px; display: flex; align-items: center; gap: 8px; }
  .pill { font-size: 11px; padding: 2px 8px; border-radius: 20px; font-weight: 600; }
  .pill.gray { background: #f1f5f9; color: #64748b; }
  .pill.green { background: #dcfce7; color: #16a34a; }
  .pill.amber { background: #fef3c7; color: #b45309; }
  .pill.indigo { background: #ede9fe; color: #6d28d9; }
  .card-link { margin-left: auto; font-size: 12px; color: #6366f1; font-weight: 600; cursor: pointer; }
  .card-link:hover { text-decoration: underline; }
  .auth-tip { font-size: 11px; color: #94a3b8; margin-top: 6px; line-height: 1.4; }
  .mcp-card.off { opacity: .6; }
  .mcp-card.off .mcp-ico { filter: grayscale(1); }
  .switch { margin-left: auto; position: relative; display: inline-flex; cursor: pointer; }
  .switch input { position: absolute; opacity: 0; width: 0; height: 0; }
  .switch .sw-track { width: 34px; height: 18px; border-radius: 20px; background: #cbd5e1; transition: .2s; position: relative; }
  .switch .sw-track::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff; transition: .2s; }
  .switch input:checked + .sw-track { background: #6366f1; }
  .switch input:checked + .sw-track::after { transform: translateX(16px); }

  .add-card { border: 1.5px dashed #cbd5e1; background: #fbfcfe; display: flex; align-items: center; justify-content: center; color: #6366f1; font-size: 14px; font-weight: 600; cursor: pointer; min-height: 92px; }
  .add-card:hover { border-color: #a5b4fc; background: #f5f3ff; }

  .empty { color: #94a3b8; font-size: 13px; padding: 40px 0; text-align: center; }

  /* modal */
  .overlay { position: absolute; inset: 0; background: rgba(15,23,42,0.4); z-index: 20; display: none; align-items: center; justify-content: center; }
  .overlay.show { display: flex; }
  .modal { background: #fff; border-radius: 16px; width: 620px; max-width: 94%; max-height: 88%; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,.25); }
  .modal-head { padding: 18px 22px; display: flex; align-items: center; }
  .modal-head .mt { font-size: 18px; font-weight: 700; color: #0f172a; }
  .modal-head .x { margin-left: auto; cursor: pointer; color: #94a3b8; font-size: 22px; width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
  .modal-head .x:hover { background: #f1f5f9; }
  .modal-body { padding: 4px 22px 18px; overflow-y: auto; flex: 1; }
  .modal-foot { padding: 14px 22px; display: flex; align-items: center; gap: 0; justify-content: flex-end; }

  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 13px; font-weight: 600; color: #334155; margin-bottom: 6px; }
  .field label .opt { color: #94a3b8; font-weight: 400; }
  .field input, .field select, .field textarea { width: 100%; border: 1px solid #e2e8f0; border-radius: 10px; padding: 10px 12px; font-size: 13px; font-family: inherit; background: #f8fafc; }
  .field textarea { min-height: 84px; resize: vertical; }
  .field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: #a5b4fc; background: #fff; }
  .mono { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }

  .ro { background: #f1f5f9 !important; color: #94a3b8 !important; cursor: not-allowed; }
  .ro-note { font-size: 12px; color: #64748b; background: #f8fafc; border-left: 3px solid #a5b4fc; padding: 8px 10px; border-radius: 6px; line-height: 1.6; margin-top: 4px; }
  .warn-note { font-size: 12px; color: #b45309; background: #fffbeb; border-left: 3px solid #fbbf24; padding: 8px 10px; border-radius: 6px; line-height: 1.6; margin-top: 4px; }

  .kv { display: grid; grid-template-columns: 1fr 1fr 32px; gap: 10px; align-items: center; margin-bottom: 8px; }
  .kv .del { color: #ef4444; cursor: pointer; text-align: center; font-size: 16px; }
  .add-line { border: 1px solid #e2e8f0; background: #fff; border-radius: 8px; padding: 7px 12px; font-size: 13px; cursor: pointer; display: inline-flex; gap: 6px; color: #475569; }

  .seg { display: inline-flex; background: #f1f5f9; border-radius: 8px; padding: 3px; }
  .seg button { border: none; background: none; padding: 6px 16px; font-size: 13px; font-weight: 600; color: #64748b; border-radius: 6px; cursor: pointer; }
  .seg button.on { background: #fff; color: #6d28d9; box-shadow: 0 1px 3px rgba(0,0,0,.08); }

  .btn.save { background: #6366f1; color: #fff; padding: 9px 22px; font-weight: 700; }
  .toast { position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%); background: #0f172a; color: #fff; padding: 10px 18px; border-radius: 8px; font-size: 13px; z-index: 40; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<div class="page-label">
  <span class="badge-num">M</span>
  <span class="badge-title">WorkHub · 租户后台「MCP」高保真原型</span>
  <span class="badge-desc">内置 MCP（超管上架分配 · 仅补 Headers）／自定义 MCP（手动配置 / 粘贴 json · sse、http）</span>
</div>

<div class="app">
  <div class="topbar">
    <div class="logo"><span class="logo-icon">W</span>WorkHub 租户后台</div>
    <span class="tenant-tag">🏢 网易－效率工程部</span>
    <div class="right"><span class="avatar">青</span></div>
  </div>

  <div class="sidebar">
    <div class="side-title">Agent 配置</div>
    <div class="side-item">🤖 Bots</div>
    <div class="side-item">🧠 Agents</div>
    <div class="side-item">✨ Skills</div>
    <div class="side-item active">🔌 MCP</div>
    <div class="side-item">📖 知识库</div>
    <div class="side-item">⚡ 自动化任务</div>
    <div class="side-sep"></div>
    <div class="side-title">运行观测</div>
    <div class="side-item">💬 对话</div>
    <div class="side-item">📊 评测</div>
  </div>

  <div class="main" id="main"></div>

  <div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
  <div class="toast" id="toast"></div>
</div>

<script>
/* ================= 数据 ================= */
/* 内置 MCP：由 Studio 超管上架并分配给本租户；租户可补 Headers、可停用，不可改图标/传输参数。
   auth: popo(静默,无需连接,无 Headers) / oauth / api
   oauth 与 api 类：租户补 Headers=提供公共账号；不补=每个用户各自链接/配置自己账号
   tenantHeaders: 是否已由租户补 Headers   enabled: 是否在本租户启用 */
const builtin = [
  { name:"POPO 云空间", ico:"📁", bg:"#e0f2fe", desc:"读写 POPO 云文档、表格、多维表与文件夹", auth:"popo", enabled:true },
  { name:"POPO 日程",   ico:"📅", bg:"#ede9fe", desc:"查询日程、预约会议与会议室、节假日查询", auth:"popo", enabled:true },
  { name:"POPO 任务",   ico:"✅", bg:"#dcfce7", desc:"创建 / 更新任务与子任务、查询任务列表", auth:"popo", enabled:true },
  { name:"易协作",     ico:"🤝", bg:"#fef3c7", desc:"协同文档、项目与流程审批的接入", auth:"popo", enabled:true },
  { name:"KM 知识管理", ico:"📚", bg:"#e0e7ff", desc:"搜索知识、阅读文章，与 KM 系统交互", auth:"popo", enabled:true },
  { name:"网易邮箱",   ico:"✉️", bg:"#eef2f7", desc:"读取邮件、搜索往来和发送邮件", auth:"oauth", enabled:true },
  { name:"GitHub",     ico:"🐙", bg:"#f1f5f9", desc:"查询代码、Issue、PR 和仓库信息", auth:"oauth", enabled:true, tenantHeaders:true, headers:[{k:"Authorization",v:"Bearer ***"}] },
  { name:"Figma",      ico:"🎨", bg:"#fae8ff", desc:"读取设计文件、页面和组件信息", auth:"oauth", enabled:false },
  { name:"CodeMaker",  ico:"⟨⟩", bg:"#e0f2fe", desc:"调用研发代码生成与分析能力", auth:"api", enabled:true },
  { name:"北大法宝",   ico:"⚖️", bg:"#f1f5f9", desc:"检索法律法规、案例与司法解释", auth:"api", enabled:true, tenantHeaders:true, headers:[{k:"apikey",v:"***"}] },
  { name:"天眼查",     ico:"🏢", bg:"#eef2f7", desc:"查询企业、股东和工商风险信息", auth:"api", enabled:true }
];
/* 自定义 MCP：租户自建，transport 仅 sse/http */
const custom = [
  { name:"内部 CRM MCP", ico:"🔌", bg:"#eef2ff", desc:"对接部门内部 CRM 系统的客户与订单数据", transport:"http", url:"https://mcp.crm.internal/mcp", headers:[{k:"Authorization",v:"Bearer ***"}] }
];

const authMeta = {
  popo:  { pill:"green",  label:"POPO 鉴权 · 静默" },
  oauth: { pill:"amber",  label:"OAuth 鉴权" },
  api:   { pill:"indigo", label:"自定义 API" }
};

let tab = "builtin";
const main = document.getElementById("main");
const overlay = document.getElementById("overlay");
const modal = document.getElementById("modal");

function render(){
  main.innerHTML = `
    <div class="main-header">
      <span class="main-title">MCP</span>
      ${tab==="custom" ? `<button class="btn primary" style="margin-left:auto;" onclick="openCustom(-1)">＋ 添加自定义 MCP</button>` : ""}
    </div>
    <div class="main-sub">管理本租户可用的 MCP 服务，供 Agent 链接外部系统调用</div>
    <div class="tabs">
      <div class="tab ${tab==="builtin"?"active":""}" onclick="switchTab('builtin')">内置 MCP</div>
      <div class="tab ${tab==="custom"?"active":""}" onclick="switchTab('custom')">自定义 MCP</div>
    </div>
    ${tab==="builtin" ? builtinView() : customView()}`;
}
function switchTab(t){ tab=t; render(); }

function builtinView(){
  return `<div class="grid">
    ${builtin.map((m,i)=>{
      const meta = authMeta[m.auth];
      const canHeaders = m.auth==="oauth" || m.auth==="api";
      let footTip = "";
      if(canHeaders){
        footTip = m.tenantHeaders
          ? `<div class="auth-tip">✅ 已配公共账号（Headers）· 全租户用户共用</div>`
          : `<div class="auth-tip">⚠️ 未配公共账号 · 每个用户使用时各自链接 / 配置自己账号</div>`;
      } else {
        footTip = `<div class="auth-tip">基于当前 POPO 身份静默鉴权，开箱即用</div>`;
      }
      return `<div class="mcp-card ${m.enabled?"":"off"}">
        <div class="mcp-ico" style="background:${m.bg};">${m.ico}</div>
        <div class="mcp-info">
          <div class="mcp-name">${m.name}${m.enabled?"":`<span class="pill gray">已停用</span>`}</div>
          <div class="mcp-desc">${m.desc}</div>
          <div class="mcp-foot">
            <span class="pill ${meta.pill}">${meta.label}</span>
            ${canHeaders ? `<span class="card-link" onclick="openHeaders(${i})">${m.tenantHeaders?"编辑公共账号":"＋ 配置公共账号"}</span>` : ""}
            <label class="switch" title="${m.enabled?"停用后本租户 Agent 不可选用":"启用"}">
              <input type="checkbox" ${m.enabled?"checked":""} onchange="toggleEnable(${i})"><span class="sw-track"></span>
            </label>
          </div>
          ${footTip}
        </div>
      </div>`;
    }).join("")}
  </div>`;
}
function toggleEnable(i){ builtin[i].enabled=!builtin[i].enabled; toast(`${builtin[i].name} 已${builtin[i].enabled?"启用":"停用"}`); render(); }

function customView(){
  if(!custom.length) return `<div class="empty">还没有自定义 MCP，点右上角「添加自定义 MCP」创建。</div>`;
  return `<div class="grid">
    ${custom.map((m,i)=>`
      <div class="mcp-card">
        <div class="mcp-ico" style="background:${m.bg};">${m.ico}</div>
        <div class="mcp-info">
          <div class="mcp-name">${m.name}</div>
          <div class="mcp-desc">${m.desc||m.url}</div>
          <div class="mcp-foot">
            <span class="pill gray">${(m.transport||"http").toUpperCase()}</span>
            ${m.headers&&m.headers.length? `<span class="pill green">已配 Headers</span>`:`<span class="pill gray">无 Headers</span>`}
            <span class="card-link" onclick="openCustom(${i})">编辑</span>
          </div>
        </div>
      </div>`).join("")}
    <div class="mcp-card add-card" onclick="openCustom(-1)">＋ 添加自定义 MCP</div>
  </div>`;
}

/* ============ 内置 MCP：补 Headers ============ */
let hForm = { idx:-1, headers:[] };
function openHeaders(i){
  const m = builtin[i];
  hForm = { idx:i, headers: (m.headers? m.headers.map(h=>({...h})) : [{k:"",v:""}]) };
  overlay.classList.add("show"); renderHeaders();
}
function renderHeaders(){
  const m = builtin[hForm.idx];
  const authTxt = m.auth==="oauth" ? "OAuth 鉴权" : "自定义 API 鉴权";
  modal.innerHTML = `
    <div class="modal-head"><span class="mt">${m.name} · 配置公共账号</span><span class="x" onclick="closeModal()">×</span></div>
    <div class="modal-body">
      <div class="ro-note">此 MCP 为<b>${authTxt}</b>类型。在此填写<b>租户公共账号凭据（Headers）</b>后，<b>全租户用户共用该账号</b>；若留空，则每个用户使用时<b>各自链接 / 配置自己的账号</b>。</div>
      <div class="field" style="margin-top:14px;">
        <label>Headers <span class="opt">（公共账号凭据，可选）</span></label>
        ${hForm.headers.map((hd,i)=>`<div class="kv"><input placeholder="Header 名称，如 Authorization" value="${hd.k}" oninput="hForm.headers[${i}].k=this.value"><input class="mono" placeholder="Header 值，如 Bearer xxx" value="${hd.v}" oninput="hForm.headers[${i}].v=this.value"><span class="del" onclick="hDel(${i})">🗑</span></div>`).join("")}
        <span class="add-line" onclick="hAdd()">＋ 添加 Header</span>
      </div>
    </div>
    <div class="modal-foot"><button class="btn save" onclick="saveHeaders()">保存</button></div>`;
}
function hAdd(){ hForm.headers.push({k:"",v:""}); renderHeaders(); }
function hDel(i){ hForm.headers.splice(i,1); if(!hForm.headers.length) hForm.headers.push({k:"",v:""}); renderHeaders(); }
function saveHeaders(){
  const m = builtin[hForm.idx];
  const valid = hForm.headers.filter(h=>h.k.trim());
  m.headers = valid; m.tenantHeaders = valid.length>0;
  toast(valid.length? `已保存 ${m.name} 的公共账号（全租户共用）` : `已清空公共账号（用户各自链接 / 配置）`);
  closeModal(); render();
}

/* ============ 自定义 MCP：手动配置 / 粘贴 json ============ */
let cForm = { idx:-1, mode:"form", transport:"http", name:"", note:"", url:"", headers:[], json:"" };
function openCustom(i){
  if(i>=0){ const m=custom[i];
    const hObj={}; (m.headers||[]).forEach(h=>{ if(h.k) hObj[h.k]=h.v; });
    const jsonStr = JSON.stringify({ name:m.name, transport:m.transport||"http", url:m.url||"", ...(Object.keys(hObj).length?{headers:hObj}:{}) }, null, 2);
    cForm={ idx:i, mode:"form", transport:m.transport||"http", name:m.name, note:m.desc||"", url:m.url||"", headers:(m.headers?m.headers.map(h=>({...h})):[]), json:jsonStr };
  }
  else cForm={ idx:-1, mode:"form", transport:"http", name:"", note:"", url:"", headers:[], json:"" };
  overlay.classList.add("show"); renderCustom();
}
function cSetMode(m){ cForm.mode=m; renderCustom(); }
function cSetTransport(t){ cForm.transport=t; renderCustom(); }
function renderCustom(){
  const isNew = cForm.idx<0;
  const formBody = `
      <div class="field"><label>服务器名称</label><input placeholder="e.g., 内部 CRM MCP" value="${cForm.name}" oninput="cForm.name=this.value"></div>
      <div class="field"><label>备注 <span class="opt">（可选）</span></label><textarea placeholder="说明此 MCP 的用途，便于 Agent 判断何时调用" oninput="cForm.note=this.value">${cForm.note}</textarea></div>
      <div class="field"><label>传输类型</label>
        <div class="seg">
          <button class="${cForm.transport==="sse"?"on":""}" onclick="cSetTransport('sse')">SSE</button>
          <button class="${cForm.transport==="http"?"on":""}" onclick="cSetTransport('http')">HTTP</button>
        </div>
      </div>
      <div class="field"><label>服务器 URL</label><input class="mono" placeholder="${cForm.transport==='sse'?'https://mcp.yourserver.com/sse':'https://mcp.yourserver.com/mcp'}" value="${cForm.url}" oninput="cForm.url=this.value"></div>
      <div class="field">
        <label>Headers <span class="opt">（可选，可不填）</span></label>
        ${cForm.headers.map((hd,i)=>`<div class="kv"><input placeholder="Header 名称" value="${hd.k}" oninput="cForm.headers[${i}].k=this.value"><input class="mono" placeholder="Header 值" value="${hd.v}" oninput="cForm.headers[${i}].v=this.value"><span class="del" onclick="cHDel(${i})">🗑</span></div>`).join("")}
        <span class="add-line" onclick="cHAdd()">＋ 添加 Header</span>
      </div>`;
  const jsonBody = `
      <div class="ro-note">粘贴标准 MCP 配置 json，支持 <b>sse / http</b> 两种传输类型，Headers 可不填。</div>
      <div class="field" style="margin-top:14px;">
        <label>配置 json</label>
        <textarea class="mono" style="min-height:200px;" placeholder='{\n  "name": "内部 CRM MCP",\n  "transport": "http",\n  "url": "https://mcp.crm.internal/mcp",\n  "headers": {\n    "Authorization": "Bearer xxx"\n  }\n}' oninput="cForm.json=this.value">${cForm.json}</textarea>
      </div>`;
  modal.innerHTML = `
    <div class="modal-head"><span class="mt">${isNew?"添加自定义 MCP":"编辑自定义 MCP"}</span><span class="x" onclick="closeModal()">×</span></div>
    <div class="modal-body">
      <div style="margin-bottom:16px;"><div class="seg">
        <button class="${cForm.mode==="form"?"on":""}" onclick="cSetMode('form')">手动配置</button>
        <button class="${cForm.mode==="json"?"on":""}" onclick="cSetMode('json')">粘贴 json</button>
      </div></div>
      ${cForm.mode==="form"? formBody : jsonBody}
    </div>
    <div class="modal-foot">
      ${isNew?"":`<button class="btn ghost" style="color:#ef4444;border-color:#fecaca;margin-right:auto;" onclick="delCustom(${cForm.idx})">删除</button>`}
      <button class="btn save" onclick="saveCustom()">保存</button>
    </div>`;
}
function delCustom(i){
  if(!confirm(`确认删除自定义 MCP「${custom[i].name}」？删除后本租户 Agent 将无法调用。`)) return;
  const n=custom[i].name; custom.splice(i,1); closeModal(); toast("已删除："+n); render();
}
function cHAdd(){ cForm.headers.push({k:"",v:""}); renderCustom(); }
function cHDel(i){ cForm.headers.splice(i,1); renderCustom(); }
function saveCustom(){
  let rec;
  if(cForm.mode==="json"){
    try{
      const o = JSON.parse(cForm.json||"{}");
      const hs = o.headers? Object.entries(o.headers).map(([k,v])=>({k,v:String(v)})) : [];
      rec = { name:o.name||"自定义 MCP", ico:"🔌", bg:"#eef2ff", desc:o.note||o.url||"", transport:(o.transport||"http").toLowerCase(), url:o.url||"", headers:hs };
    }catch(e){ toast("json 解析失败，请检查格式"); return; }
  } else {
    rec = { name:cForm.name.trim()||"自定义 MCP", ico:"🔌", bg:"#eef2ff", desc:cForm.note.trim(), transport:cForm.transport, url:cForm.url.trim(), headers:cForm.headers.filter(h=>h.k.trim()) };
  }
  if(cForm.idx>=0) custom[cForm.idx]=rec; else custom.push(rec);
  toast("已保存自定义 MCP：" + rec.name);
  closeModal(); render();
}

function closeModal(){ overlay.classList.remove("show"); }
let toastTimer;
function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove("show"),2600); }

render();
</script>
</body>
</html>
